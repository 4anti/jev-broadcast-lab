<!DOCTYPE html>
<html lang="en" data-booth="emotion">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat emotion · Jev Broadcast Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@400;600&family=Red+Hat+Text:wght@400;600;700&family=Teko:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../shared/broadcast.css" />
</head>
<body>
  <div class="booth">
    <section class="stage">
      <p class="kicker">Chat emotion</p>
      <h1>What is this person feeling?</h1>
      <p class="lede">Jev picks one label from a closed emotion list, then whether the thread is mixed, how strong it is, and whether they are hiding it. This is not a diagnosis. Pick a thread, then Read.</p>
      <div id="examples"></div>
      <div id="out"><p class="idle-note">Primary feeling, mix, intensity, and mask bars land here.</p></div>
    </section>
    <aside class="rack">
      <h2>Thread</h2>
      <div class="field">
        <label for="history">Earlier messages (optional)</label>
        <textarea id="history" rows="6"></textarea>
      </div>
      <div class="field">
        <label for="latest">Latest message</label>
        <textarea id="latest" rows="5">I am fine. Seriously. Stop asking.</textarea>
      </div>
      <div class="field" id="keyField" style="display:none">
        <label for="apiKey">TypeSafe API key</label>
        <input id="apiKey" type="password" autocomplete="off" />
      </div>
      <button class="btn" id="runBtn">Read</button>
    </aside>
  </div>
  <script type="module" src="./emotion.js"></script>
</body>
</html>
