name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Refuse secrets in the tree
        run: |
          set -euo pipefail
          if git grep -I -E 'apikey_[0-9a-f]{8}|TYPESAFE_API_KEY=.+' -- ':!.env.example' ':!README.md' ':!.github/workflows/pages.yml'; then
            echo "Possible secret in the git tree" >&2
            exit 1
          fi
          if git grep -I -E '[A-Za-z0-9._%+-]+@(gmail|googlemail|outlook|hotmail|yahoo|icloud|proton)\.[A-Za-z]{2,}' -- ':!web/vendor/**'; then
            echo "Personal email in the git tree" >&2
            exit 1
          fi
      - name: Point Pages at the key proxy
        env:
          PROXY: ${{ secrets.JEV_PROXY_URL }}
        run: |
          python - <<'PY'
          import json, os
          proxy = (os.environ.get("PROXY") or "").strip()
          if not proxy:
              raise SystemExit(0)
          open("web/config.json", "w", encoding="utf-8").write(json.dumps({
              "hasEnvKey": True,
              "modelDefault": "jev-latest",
              "proxy": proxy.rstrip("/"),
          }))
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v5
