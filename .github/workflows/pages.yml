name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse secrets in the tree
        run: |
          set -euo pipefail
          if git grep -I -E 'apikey_[0-9a-f]{8}|TYPESAFE_API_KEY=.+' -- ':!.env.example' ':!README.md' ':!.github/workflows/pages.yml'; then
            echo "Possible secret in the git tree" >&2
            exit 1
          fi
          if git grep -I -E '[A-Za-z0-9._%+-]+@(gmail|googlemail|outlook|hotmail|yahoo|icloud|proton)\.[A-Za-z]{2,}' -- ':!web/vendor/**'; then
            echo "Personal email in the git tree" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
